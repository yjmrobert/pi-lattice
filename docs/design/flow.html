<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Lattice Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: two terminals, one above the other. The upper is Pi on the flow: five columns of states, lanes that are the tree, a band under them that answers. The lower is another agent's shell on the same board. Both are pictures of a terminal, so the page is dark by choice in either theme; the tokens are the ones the pane and canopy mockups use. */
:root {
  color-scheme: dark;
  --page: #06080c; --t-bg: #0b0e14; --t-panel: #10141c; --t-edge: #232936; --t-fg: #c6ccd9; --t-dim: #808a9e; --t-bright: #f3f6fb;
  --amber: #e8b755; --t-red: #f0717b; --t-cyan: #5fd4d0; --t-mag: #e06bd0;
  --t-sel: #1b2a44; --t-sel-fg: #dbe3f2; --t-key: #272e3d;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--t-fg); font: 400 13px/1.5 var(--mono); font-variant-ligatures: none; font-variant-numeric: tabular-nums; padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
::selection { background: var(--t-sel); color: var(--t-bright); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 1px solid var(--t-cyan); outline-offset: 1px; }
pre { margin: 0; font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; }
kbd { font: inherit; color: var(--t-bright); background: var(--t-key); padding: 0 7px; border-radius: 2px; }
.page { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.win { background: var(--t-bg); border: 1px solid var(--t-edge); border-radius: 6px; position: relative; overflow: hidden; }
.bar { display: flex; flex-wrap: wrap; gap: 2px 16px; justify-content: space-between; padding: 5px 14px; background: var(--t-panel); border-bottom: 1px solid var(--t-edge); color: var(--t-dim); }
.bar b { color: var(--t-fg); font-weight: 400; }
.td { color: var(--t-dim); } .tw { color: var(--t-bright); font-weight: 700; } .ta { color: var(--amber); } .tr { color: var(--t-red); }
.row { padding: 0 14px; }

#top { display: flex; flex-wrap: wrap; gap: 0 22px; padding-top: 8px; }
#top .net { color: var(--t-mag); font-weight: 700; }
#top .lens { margin-left: auto; color: var(--t-dim); }
#top .lens a { color: var(--t-dim); text-decoration: none; } #top .lens a:hover { color: var(--t-bright); }
#top .lens b { color: var(--t-bright); }
#since { color: var(--t-dim); padding-bottom: 10px; display: flex; flex-wrap: wrap; gap: 0 22px; }

/* The board. Every lane uses the same five tracks, so columns line up as they would on a grid of cells. */
.cols { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); column-gap: 14px; }
#heads { padding-bottom: 4px; border-bottom: 1px solid var(--t-edge); }
.head { color: var(--t-dim); padding: 0 6px; display: block; width: 100%; }
.head .name { letter-spacing: .06em; }
.head.mine .name { color: var(--t-bright); font-weight: 700; }
.head.on .name { text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--t-cyan); }
.head small { display: block; font-size: inherit; min-height: 1.5em; }
#lanes { padding-block: 6px 10px; min-height: 22em; }
.epic { color: var(--t-dim); padding: 8px 6px 0; }
.epic:first-child { padding-top: 0; }
.lane > .lh { display: flex; gap: 0 12px; flex-wrap: wrap; padding: 2px 6px 0; width: 100%; }
.lane > .lh .bar2 { letter-spacing: 1px; }
.cell { display: flex; flex-direction: column; min-width: 0; padding-bottom: 4px; }
.card { display: flex; gap: 1ch; padding: 0 6px; min-width: 0; width: 100%; border-radius: 2px; white-space: nowrap; }
.card .g { flex: none; width: 1ch; text-align: center; }
.card .num { flex: none; color: var(--t-dim); }
.card .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.card .tail { flex: none; margin-left: auto; color: var(--t-dim); }
.card:hover { background: var(--t-panel); }
.card.proposed .t, .card.held .t, .card.done .t { color: var(--t-dim); }
.card.done .g { color: var(--t-dim); }
.card.sel { background: var(--t-sel); }
.card.sel .t { color: var(--t-bright); } .card.sel .num, .card.sel .tail { color: var(--t-sel-fg); }
.card.off { opacity: .28; }
.none { color: var(--t-dim); padding: 0 6px; }
.blink { animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .35; } }

#band { border-top: 1px solid var(--t-edge); padding-block: 8px; min-height: 8.6em; display: flex; flex-direction: column; gap: 1px; }
#band .what { display: flex; flex-wrap: wrap; gap: 0 14px; }
#band .body { color: var(--t-fg); max-width: 100ch; }
#band .do { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 5px; color: var(--t-dim); }
.k:hover { color: var(--t-bright); }
.k.amber kbd { background: #4a3a14; color: var(--amber); }
#say { color: var(--t-dim); min-height: 1.5em; margin-top: 3px; }
#linewrap { display: flex; gap: 1ch; margin-top: 5px; }
#line { flex: 1; min-width: 0; font: inherit; color: var(--t-bright); background: none; border: 0; border-bottom: 1px solid var(--t-edge); padding: 0; caret-color: var(--amber); outline: none; }
#line:focus { border-bottom-color: var(--amber); }
#keys { display: flex; flex-wrap: wrap; gap: 4px 18px; padding-block: 7px; border-top: 1px solid var(--t-edge); background: var(--t-panel); color: var(--t-dim); }

/* The issue, opened over the board as a session is: the board stays behind it at about a third. */
#pi.boxed > :not(#box):not(.bar) { opacity: .3; }
#box { position: absolute; inset: 44px 0 auto; margin: 0 auto; width: min(92%, 86ch); max-height: calc(100% - 64px); overflow: auto; background: var(--t-bg); border: 1px solid var(--t-cyan); border-radius: 4px; box-shadow: 0 18px 48px rgba(0, 0, 0, .6); scrollbar-color: var(--t-edge) transparent; }
#box .edge { display: flex; flex-wrap: wrap; gap: 0 14px; padding: 4px 14px; border-bottom: 1px solid var(--t-edge); background: var(--t-panel); position: sticky; top: 0; }
#box .in { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
#box h3 { font: inherit; color: var(--t-dim); letter-spacing: .08em; margin: 0 0 2px; }
#box .hist { display: grid; grid-template-columns: 5ch minmax(0, 1fr); gap: 0 12px; }

#log { padding: 10px 14px 4px; height: 17.5em; overflow-y: auto; scrollbar-color: var(--t-edge) transparent; }
#log .p { color: var(--t-cyan); } #log .c { color: var(--t-bright); }
#cmds { display: flex; flex-wrap: wrap; gap: 6px 10px; padding: 6px 14px 12px; }
#cmds button { border: 1px solid var(--t-edge); border-radius: 3px; padding: 1px 10px; color: var(--t-fg); transition: border-color .15s, color .15s; }
#cmds button:hover { border-color: var(--t-cyan); color: var(--t-bright); }
#cmds button:active { background: var(--t-sel); }

@media (max-width: 900px) {
  body { font-size: 12px; }
  #heads { display: flex; gap: 2px 14px; flex-wrap: wrap; }
  .head { width: auto; padding: 0; } .head small { display: none; } .head.on small { display: inline; min-height: 0; }
  #lanes .cols { grid-template-columns: minmax(0, 1fr); }
  #lanes .cell:not(.cur) { display: none; }
  #box { inset: 34px 0 auto; width: 96%; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="page">
  <section class="win" id="pi" aria-label="Pi, on the flow">
    <div class="bar"><span><b>pi</b>  ~/shop</span><span>the flow, as proposed in ADR 0033 · every key below works, and can be clicked</span></div>
    <div class="row" id="top"></div>
    <div class="row" id="since"></div>
    <div class="row cols" id="heads"></div>
    <div class="row" id="lanes"></div>
    <div class="row" id="band"></div>
    <div class="row" id="keys"></div>
    <div id="box" role="dialog" aria-label="The issue" hidden></div>
  </section>

  <section class="win" id="sh" aria-label="Another agent's shell">
    <div class="bar"><span><b>claude</b>  ~/shop</span><span>an agent that is not a Pi session, on the same board through the command line</span></div>
    <pre id="log" aria-live="polite"></pre>
    <div id="cmds">
      <button data-c="next">pi-lattice work next</button>
      <button data-c="done">pi-lattice work done</button>
      <button data-c="drop">pi-lattice work drop</button>
      <button data-c="board">pi-lattice work</button>
      <button data-c="prime">pi-lattice work prime</button>
    </div>
  </section>
</div>

<script>
// One invented team on one server. Everything on the page is drawn from this, and every key changes it.
const HUE = { yan: '#5fd4d0', sam: '#7aa7ff', mira: '#c79bf2', teo: '#7fd18b' };
const ME = 'yan', LIMIT = 3, STATES = ['proposed', 'ready', 'doing', 'review', 'done'];
const EPICS = [{ id: 'checkout-v2', owner: 'yan', repo: 'shop' }, { id: 'pricing-migration', owner: 'sam', repo: 'billing-api' }, { id: 'sso-rollout', owner: 'mira', repo: 'infra' }];
const FEATS = [{ id: 'saved-cards', epic: 'checkout-v2' }, { id: 'tax-lines', epic: 'checkout-v2' }, { id: 'new-tables', epic: 'pricing-migration' }, { id: 'oidc', epic: 'sso-rollout' }];
const I = (n, t, f, st, x = {}) => ({ n, t, f, st, body: '', means: '', hist: [], ...x });
let issues = [
  I(44, 'retry failed charges', 'saved-cards', 'proposed', { by: 'planner', age: '12m', body: 'A charge that fails for a soft reason (insufficient funds, issuer unavailable) is tried again after 1, 3 and 7 days.', means: 'three retries on the schedule; a hard decline is never retried.' }),
  I(45, 'card expiry reminders', 'saved-cards', 'proposed', { by: 'planner', age: '12m', body: 'Mail the customer 30 days before a saved card expires.', means: 'one mail per card; none for a card already replaced.' }),
  I(38, 'card form validation', 'saved-cards', 'ready', { body: 'Validate number, expiry and CVC as they are typed.', means: 'wrong input is marked before submit; amex lengths are right.' }),
  I(39, 'delete a saved card', 'saved-cards', 'ready', { body: 'A customer removes a card from their account.', means: 'the token is deleted at the vault; the default moves to the next card.' }),
  I(35, 'tokenize on submit', 'saved-cards', 'doing', { agent: 'worker-2', kind: 'pi', act: 'running the card tests', age: '6m', body: 'Exchange the card for a vault token in the browser, so the number never reaches us.', means: 'no card number in any request to our API.' }),
  I(33, 'stripe webhooks', 'saved-cards', 'review', { agent: 'worker-1', kind: 'pi', age: '12m', body: 'Receive charge.succeeded and charge.failed.', means: 'both events update the order; a replayed event changes nothing.', result: { sum: 'Handles charge.succeeded and charge.failed; replays are ignored by event id.', check: '14 tests pass · replayed a failed charge against staging', diff: '+212 −18 in 6 files' } }),
  I(37, 'card brand icons', 'saved-cards', 'review', { agent: 'worker-3', kind: 'pi', age: '31m', body: 'Show the brand beside each saved card.', means: 'visa, mastercard and amex are drawn; anything else gets the plain card.', result: { sum: 'Brand is read from the first digits and drawn as an inline SVG. No new dependency.', check: '6 tests pass · looked at each brand in the account page', diff: '+88 −4 in 3 files' } }),
  I(30, 'vault schema', 'saved-cards', 'done'), I(31, 'customer mapping', 'saved-cards', 'done'),
  I(46, 'tax-exempt customers', 'tax-lines', 'proposed', { by: 'worker-4', age: '4m', body: 'Found while on #36: exempt customers are taxed like everyone else. Needs a flag on the customer and a rule in the totals.', means: 'an exempt customer has no tax line.' }),
  I(40, 'tax per line item', 'tax-lines', 'ready', { waits: 52, body: 'Tax is worked out per line, from the new price tables.', means: 'each line carries its tax; the lines sum to the order tax.' }),
  I(36, 'rounding rules', 'tax-lines', 'doing', { agent: 'worker-4', kind: 'pi', age: '9m', act: 'waiting for you', ask: "Round half up, or banker's rounding? The old code does both in different places.", body: 'One rounding rule for every amount.', means: 'the same input gives the same cents everywhere.' }),
  I(34, 'totals endpoint', 'tax-lines', 'review', { agent: 'worker-5', kind: 'pi', age: '48m', body: 'One endpoint that returns the totals of a cart.', means: 'subtotal, tax, shipping, total; the cart page uses it.', result: { sum: 'GET /cart/totals, used by the cart page. The old client-side sum is removed.', check: '22 tests pass · cart page checked by hand with three carts', diff: '+140 −96 in 5 files' } }),
  I(29, 'tax table', 'tax-lines', 'done'),
  I(47, 'archive old price rows', 'new-tables', 'proposed', { by: 'copier', age: '20m', body: 'Rows older than two years go to cold storage after the cutover.', means: 'the live table holds two years.' }),
  I(48, 'price history view', 'new-tables', 'proposed', { by: 'copier', age: '20m', body: 'A read-only view of how a price changed.', means: 'finance can read it without access to the tables.' }),
  I(53, 'verify the copy', 'new-tables', 'ready', { waits: 52, body: 'Compare old and new tables row by row.', means: 'no difference, or each one explained.' }),
  I(54, 'flip the read flag', 'new-tables', 'ready', { human: true, body: 'Switch reads to the new tables.', means: 'done by a person, in the change window.' }),
  I(52, 'copy prices across', 'new-tables', 'doing', { agent: 'copier', kind: 'pi', age: '22m', act: 'batch 31 of 40', body: 'Copy every price into the new tables without a freeze.', means: 'every row copied; writes during the copy are not lost.' }),
  I(50, 'schema', 'new-tables', 'done'), I(51, 'indexes', 'new-tables', 'done'),
  I(61, 'group claims', 'oidc', 'ready', { body: 'Put a person\'s groups in the token.', means: 'tools read groups from the token.' }),
  I(62, 'log out everywhere', 'oidc', 'ready', { body: 'Ending one session ends them all.', means: 'every tool asks again within a minute.' }),
  I(60, 'token refresh', 'oidc', 'doing', { agent: 'codex', kind: 'cli', age: '3m', act: 'last command 3m ago', body: 'Refresh a token before it expires.', means: 'nobody is logged out mid-task.' }),
  I(58, 'session store', 'oidc', 'review', { agent: 'worker-1', kind: 'pi', age: '15m', body: 'Sessions in Redis, not in memory.', means: 'a restart logs nobody out.', result: { sum: 'Sessions are kept in Redis with a 12h expiry.', check: '9 tests pass · restarted the provider with a live session', diff: '+175 −60 in 4 files' } }),
  I(57, 'provider config', 'oidc', 'done'), I(56, 'client registry', 'oidc', 'done'), I(55, 'signing keys', 'oidc', 'done'),
];
issues.forEach(i => { if (!i.hist.length) i.hist = [[i.by ? i.age || '1h' : '2d', i.by ? `${i.by} proposed it` : '@' + ownerOf(i) + ' filed it']]; });

let sel = 33, col = 3, level = 'feature', folded = new Set(), find = '', said = '', mode = null, boxed = false, hold = null, nextNo = 63;
const $ = q => document.querySelector(q);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const narrow = matchMedia('(max-width: 900px)');
function featOf(i) { return FEATS.find(f => f.id === i.f); }
function epicOf(i) { return EPICS.find(e => e.id === featOf(i).epic); }
function ownerOf(i) { return epicOf(i).owner; }
const get = n => issues.find(i => i.n === n);
const done = i => i.st === 'done';
const held = i => i.st === 'ready' && i.waits && !done(get(i.waits));
const inReview = who => issues.filter(i => i.st === 'review' && ownerOf(i) === who).length;
const full = who => inReview(who) >= LIMIT;
const note = (i, what) => i.hist.unshift(['now', what]);

// Lanes are the tree, at the level chosen with l.
function lanes() {
  if (level === 'none') return [{ id: 'all', label: 'everything', kind: '', owner: null, has: () => true }];
  if (level === 'epic') return EPICS.map(e => ({ id: e.id, label: e.id, kind: 'epic', owner: e.owner, has: i => epicOf(i).id === e.id }));
  return FEATS.map(f => ({ id: f.id, label: f.id, kind: 'feature', owner: EPICS.find(e => e.id === f.epic).owner, epic: f.epic, has: i => i.f === f.id }));
}
const shown = i => !lanes().some(l => folded.has(l.id) && l.has(i));
function column(c) { return lanes().flatMap(l => folded.has(l.id) ? [] : issues.filter(i => i.st === STATES[c] && l.has(i))); }

function mark(i) {
  const h = `style="color:${HUE[ownerOf(i)]}"`;
  if (i.st === 'proposed') return '<span class="g td">·</span>';
  if (i.st === 'ready') return held(i) ? '<span class="g td">⧗</span>' : i.human ? `<span class="g" ${h}>□</span>` : `<span class="g" ${h}>○</span>`;
  if (i.st === 'doing') return i.ask ? '<span class="g ta blink">●</span>' : `<span class="g spin" ${h}>⠹</span>`;
  if (i.st === 'review') return '<span class="g ta">◇</span>';
  return '<span class="g">✓</span>';
}
function card(i) {
  const tail = i.st === 'doing' ? i.agent : held(i) ? '#' + i.waits : i.human && i.st === 'ready' ? 'a person' : i.quiet ? 'went quiet' : '';
  const off = find && !(`${i.n} ${i.t} ${i.agent || ''} @${ownerOf(i)} ${i.f}`).toLowerCase().includes(find.toLowerCase());
  return `<button class="card ${i.st}${held(i) ? ' held' : ''}${i.n === sel ? ' sel' : ''}${off ? ' off' : ''}" data-n="${i.n}">${mark(i)}<span class="num">${i.n}</span><span class="t">${esc(i.t)}</span>${tail ? `<span class="tail">${esc(tail)}</span>` : ''}</button>`;
}

function render() {
  const before = new Map();
  document.querySelectorAll('#lanes [data-n]').forEach(e => before.set(e.dataset.n, e.getBoundingClientRect()));
  const count = c => issues.filter(i => i.st === STATES[c]).length;
  const people = Object.keys(HUE).map((p, n) => {
    if (p === 'teo') return `<span class="td">${n + 1} ○@teo away</span>`;
    const mine = issues.filter(i => i.st === 'doing' && ownerOf(i) === p), asks = mine.filter(i => i.ask).length;
    return `<span><span class="td">${n + 1}</span> <span style="color:${HUE[p]}">@${p}</span> <span class="spin" style="color:${HUE[p]}">⠹</span>${mine.length - asks}${asks ? ` <span class="ta">●${asks}</span>` : ''}</span>`;
  }).join('');
  $('#top').innerHTML = `<span class="net">◆ harbor</span>${people}<span class="lens"><a href="overview/canopy.html" title="The same work as a tree">tree</a> │ <b>flow</b></span>`;
  $('#since').innerHTML = `<span>since you looked 40m ago</span><span>6 landed</span><span>4 proposed by agents</span><span>0 went quiet</span>`;

  const sub = c => c === 0 ? (count(0) ? 'yours to release' : 'nothing to release') : c === 3 ? (full(ME) ? `<span class="ta">yours ${inReview(ME)} of ${LIMIT} · full</span>` : `yours ${inReview(ME)} of ${LIMIT}`) : c === 1 && full(ME) ? '<span class="ta">held until you review</span>' : '';
  $('#heads').innerHTML = STATES.map((s, c) => `<button class="head${c === 0 || c === 3 ? ' mine' : ''}${c === col ? ' on' : ''}" data-col="${c}"><span class="name">${s.toUpperCase()}</span> ${count(c)}${c === 4 ? ' today' : ''} <small>${sub(c)}</small></button>`).join('');

  let out = '', epic = null;
  for (const l of lanes()) {
    const all = issues.filter(l.has), d = all.filter(done).length, w = Math.min(12, Math.max(4, all.length));
    const fill = Math.round(w * d / (all.length || 1));
    if (level === 'feature' && l.epic !== epic) { epic = l.epic; out += `<div class="epic">${esc(epic)}  epic  <span style="color:${HUE[l.owner]}">@${l.owner}</span></div>`; }
    const f = folded.has(l.id);
    out += `<div class="lane"><button class="lh" data-lane="${l.id}" title="Fold this lane"><span class="td">${f ? '▸' : '▾'}</span><span class="tw">${esc(l.label)}</span><span class="td">${l.kind}</span>` +
      (l.owner ? `<span class="bar2" style="color:${HUE[l.owner]}">${'█'.repeat(fill)}<span class="td">${'░'.repeat(w - fill)}</span></span>` : '') + `<span class="td">${d} of ${all.length}</span></button><div class="cols">` +
      STATES.map((s, c) => { const cs = all.filter(i => i.st === s); return `<div class="cell${c === col ? ' cur' : ''}">${f ? `<span class="none">${cs.length || ''}</span>` : cs.map(card).join('') || (narrow.matches ? '<span class="none">none</span>' : '')}</div>`; }).join('') + '</div></div>';
  }
  $('#lanes').innerHTML = out || '<div class="none">No work yet. n files the first issue; or tell a session what you want, and release what it proposes.</div>';

  band();
  $('#keys').innerHTML = [['←→', 'column'], ['↑↓', 'issue'], ['tab', 'next that needs you'], ['space', 'the issue'], ['n', 'new'], ['/', 'find'], ['f', 'fold'], ['l', `lanes: ${level}`], ['v', 'the tree']]
    .map(([k, d]) => `<button class="k" data-k="${k}"><kbd>${k}</kbd> ${d}</button>`).join('');
  $('#pi').classList.toggle('boxed', boxed); $('#box').hidden = !boxed; if (boxed) box();

  if (!still) document.querySelectorAll('#lanes [data-n]').forEach(e => {
    const b = before.get(e.dataset.n); if (!b) return;
    const a = e.getBoundingClientRect(), dx = b.left - a.left, dy = b.top - a.top;
    if (Math.abs(dx) + Math.abs(dy) > 2) e.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.16,1,.3,1)' });
  });
}

const K = (k, d, amber) => `<button class="k${amber ? ' amber' : ''}" data-k="${k}"><kbd>${k}</kbd> ${d}</button>`;
function band() {
  const i = get(sel);
  let h;
  if (!i) h = `<div class="what td">Nothing ${STATES[col]}${col === 3 ? '. Nothing is waiting for you here' : ''}.</div><div class="do">${K('tab', 'next that needs you')}${K('n', 'new issue')}</div>`;
  else {
    const o = ownerOf(i), who = `<span style="color:${HUE[o]}">@${o}${o === ME ? ' (you)' : ''}</span>`, where = `<span class="td">${i.f}</span>`;
    const head = (m, rest) => `<div class="what">${m} <span class="tw">#${i.n} ${esc(i.t)}</span><span class="td">${rest}</span>${where}${who}</div>`;
    const mineToDo = o === ME;
    if (i.st === 'proposed') {
      const n = issues.filter(x => x.st === 'proposed' && x.f === i.f).length;
      h = head('<span class="td">·</span>', `proposed ${i.age} ago by ${i.by}`) + `<div class="body">${esc(i.body)}</div><div class="td">Nothing takes it until it is released.</div>` +
        `<div class="do">${K('g', 'release', 1)}${n > 1 ? K('G', `release all ${n} under ${i.f}`, 1) : ''}${K('x', 'drop', 1)}${K('o', 'something else', 1)}</div>`;
    } else if (i.st === 'ready') {
      const line = column(1).filter(x => x.f === i.f && !held(x) && !x.human), at = line.indexOf(i) + 1;
      const why = held(i) ? `Held: it waits on #${i.waits} ${get(i.waits).t}, which is not finished.` : i.human ? 'For a person. No session takes it.' : full(o) ? `Ready, but nothing is handed out: ${inReview(o)} of @${o}'s are waiting for review, and ${LIMIT} is the limit.` : `Ready. ${at === 1 ? 'Next' : ['', '', '2nd', '3rd'][at] || at + 'th'} to be taken under ${i.f}.`;
      h = head(held(i) ? '<span class="td">⧗</span>' : '○', i.quiet ? 'given back: its agent went quiet' : i.back ? 'sent back' : 'ready') + `<div class="body">${esc(i.body)}</div><div class="${full(o) && !held(i) && !i.human ? 'ta' : 'td'}">${why}</div>` +
        `<div class="do">${K('[', 'earlier')}${K(']', 'later')}${K('s', 'put a session on it')}${K('h', i.human ? 'let sessions take it' : 'keep it for a person')}${K('b', 'back to proposed')}</div>`;
    } else if (i.st === 'doing' && i.ask) {
      h = head('<span class="ta">●</span>', `${i.agent} asks · ${i.age}`) + `<div class="body">${esc(i.ask)}</div>` +
        `<div class="do">${K('y', 'half up', 1)}${K('n', "banker's", 1)}${K('o', 'something else', 1)}${K('enter', 'open the session')}</div>`;
    } else if (i.st === 'doing') {
      const out = i.kind === 'cli';
      h = head(`<span style="color:${HUE[o]}">◉</span>`, `${i.agent} is on it · ${i.age}`) + `<div class="body">${esc(i.body)}</div><div class="td">${out ? `Not a Pi session: ${i.agent}, through the command line. ${esc(i.act)}; given back after 30m of quiet.` : `A Pi session. Last: ${esc(i.act)}.`}</div>` +
        `<div class="do">${out ? '' : K('enter', 'open the session')}${K('b', 'take it back')}</div>`;
    } else if (i.st === 'review') {
      h = head('<span class="ta">◇</span>', `up for review ${i.age} · ${i.agent}${i.kind === 'cli' ? ' (command line)' : ''}`) + `<div class="body">${esc(i.result.sum)}</div><div><span class="td">checked</span>  ${esc(i.result.check)}   <span class="td">${esc(i.result.diff)}</span></div>` +
        `<div class="do">${mineToDo ? K('a', 'accept', 1) + K('x', 'send back', 1) + K('o', 'something else', 1) : `<span>@${o} reviews this one.</span>`}${i.kind === 'cli' ? '' : K('enter', 'open the session')}</div>`;
    } else h = head('<span class="td">✓</span>', 'done') + `<div class="td">${esc(i.hist[0][1])}.</div><div class="do">${K('b', 'reopen')}</div>`;
  }
  if (mode) h += `<label id="linewrap"><span class="ta">${esc(mode.ask)}</span><input id="line" autocomplete="off" spellcheck="false" aria-label="${esc(mode.ask)}"></label><div class="td">enter to send · esc to leave it</div>`;
  else h += `<div id="say">${said}</div>`;
  $('#band').innerHTML = h;
  if (mode) { const el = $('#line'); el.value = mode.value || ''; el.focus(); }
}

function box() {
  const i = get(sel); if (!i) { boxed = false; $('#box').hidden = true; $('#pi').classList.remove('boxed'); return; }
  const o = ownerOf(i), c = HUE[o], waiting = issues.filter(x => x.waits === i.n);
  $('#box').style.borderColor = i.st === 'review' || i.ask ? 'var(--amber)' : c;
  $('#box').innerHTML = `<div class="edge"><span class="tw">#${i.n} ${esc(i.t)}</span><span style="color:${c}">@${o}${o === ME ? ' (you)' : ''}</span><span class="td">task · ${epicOf(i).id} ▸ ${i.f} · ${epicOf(i).repo}</span><span class="${i.st === 'review' || i.ask ? 'ta' : 'td'}" style="margin-left:auto">${i.ask ? 'needs you' : held(i) ? 'held' : i.st}</span></div><div class="in">` +
    `<div><div>${esc(i.body) || '<span class="td">Nothing written.</span>'}</div>${i.means ? `<div><span class="td">Done means</span>  ${esc(i.means)}</div>` : ''}</div>` +
    (i.waits ? `<div><h3>WAITS ON</h3><div>${done(get(i.waits)) ? '<span class="td">✓</span>' : '⧗'} #${i.waits} ${esc(get(i.waits).t)} <span class="td">${get(i.waits).st}</span></div></div>` : '') +
    (waiting.length ? `<div><h3>WAITING ON IT</h3>${waiting.map(x => `<div>⧗ #${x.n} ${esc(x.t)} <span class="td">${x.f}</span></div>`).join('')}</div>` : '') +
    (i.result ? `<div><h3>RESULT</h3><div>${esc(i.result.sum)}</div><div><span class="td">checked</span>  ${esc(i.result.check)}</div><div class="td">${esc(i.result.diff)}</div></div>` : '') +
    `<div><h3>WHAT HAPPENED</h3><div class="hist">${i.hist.map(([at, what]) => `<span class="td">${esc(at)}</span><span>${esc(what)}</span>`).join('')}</div></div>` +
    `<div class="do td" style="display:flex;flex-wrap:wrap;gap:4px 18px">${K('esc', 'close')}<span><kbd>e</kbd> edit in Pi's editor</span><span><kbd>t</kbd> comment</span></div></div>`;
}

// Moving about.
function pick(n) { sel = n; const i = get(n); if (i) col = STATES.indexOf(i.st); }
function toCol(c) { col = c; const cs = column(c); const cur = get(sel); sel = (cs.find(i => cur && i.f === cur.f) || cs[0] || {}).n ?? null; }
function side(d) { let c = col + d; while (c >= 0 && c < 5 && !column(c).length && !narrow.matches) c += d; if (c >= 0 && c < 5) toCol(c); }
function updown(d) { const cs = column(col), at = cs.findIndex(i => i.n === sel); if (cs.length) sel = cs[Math.max(0, Math.min(cs.length - 1, at + d))].n; }
function needsMe() { const q = issues.filter(i => i.ask && ownerOf(i) === ME), r = issues.filter(i => i.st === 'review' && ownerOf(i) === ME).reverse(); const all = [...q, ...r].filter(shown); if (!all.length) return said = 'Nothing needs you.'; pick(all[(all.findIndex(i => i.n === sel) + 1) % all.length].n); }
// After something leaves a column, stay in the column: the next one there is usually next to be decided.
function move(i, st, first) {
  const cs = column(col), at = cs.indexOf(i), after = cs[at + 1] || cs[at - 1];
  issues = issues.filter(x => x !== i); i.st = st;
  const same = issues.filter(x => x.f === i.f && x.st === st), anchor = first ? same[0] : null;
  if (anchor) issues.splice(issues.indexOf(anchor), 0, i); else { const last = same[same.length - 1] || issues.filter(x => x.f === i.f).pop(); issues.splice(issues.indexOf(last) + 1, 0, i); }
  sel = after ? after.n : i.n; if (!after) col = STATES.indexOf(st);
}
function ask(kind, text, value = '') { mode = { kind, ask: text, value }; }

function key(k) {
  const i = get(sel); said = '';
  if (boxed) { if (k === 'esc' || k === 'space') boxed = false; return render(); }
  if (k === '←→') return; if (k === '↑↓') return;
  if (k === 'left') side(-1); else if (k === 'right') side(1); else if (k === 'up') updown(-1); else if (k === 'down') updown(1);
  else if (k === 'tab') needsMe();
  else if (k === 'space') { if (i) boxed = true; }
  else if (k === 'v') { location.href = 'overview/canopy.html'; return; }
  else if (k === 'l') { level = { feature: 'epic', epic: 'none', none: 'feature' }[level]; folded.clear(); }
  else if (k === 'f') { const l = lanes().find(l => i && l.has(i)); if (l) { folded.add(l.id); toCol(col); said = `${l.label} is folded to its counts. Click it, or f on another of its lanes, to unfold.`; } }
  else if (i && i.ask && (k === 'y' || k === 'n')) { note(i, `@yan answered: ${k === 'y' ? 'half up' : "banker's"}`); i.ask = null; i.act = 'carrying on'; said = `Answered. ${i.agent} carries on.`; }
  else if (k === 'n') ask('new',`new issue${i ? ' under ' + i.f : ''}:`);
  else if (k === '/') ask('find', 'find:', find);
  else if (k === 'esc') { find = ''; }
  else if (!i) { }
  else if (i.st === 'proposed' && k === 'g') { note(i, '@yan released it'); move(i, 'ready'); said = `#${i.n} is ready. A session takes it when its turn comes.`; }
  else if (i.st === 'proposed' && k === 'G') { const all = issues.filter(x => x.st === 'proposed' && x.f === i.f); all.forEach(x => { note(x, '@yan released it'); move(x, 'ready'); }); said = `Released ${all.length} under ${i.f}.`; toCol(0); if (sel === null) pick(all[0].n); }
  else if (i.st === 'proposed' && k === 'x') { const cs = column(0), at = cs.indexOf(i); issues = issues.filter(x => x !== i); sel = (cs[at + 1] || cs[at - 1] || {}).n ?? null; said = `#${i.n} is dropped. ${i.by} is told.`; }
  else if (k === 'o' && (i.st === 'proposed' || i.st === 'review' || i.ask)) ask('else', 'instead:');
  else if (i.st === 'ready' && (k === '[' || k === ']')) { const same = issues.filter(x => x.f === i.f && x.st === 'ready'), at = same.indexOf(i), other = same[at + (k === '[' ? -1 : 1)]; if (other) { const a = issues.indexOf(i), b = issues.indexOf(other); [issues[a], issues[b]] = [issues[b], issues[a]]; said = `#${i.n} is now ${k === '[' ? 'before' : 'after'} #${other.n}. Sessions take them in this order.`; } else said = `#${i.n} is already ${k === '[' ? 'first' : 'last'} under ${i.f}.`; }
  else if (i.st === 'ready' && k === 's') { if (held(i)) said = `#${i.n} waits on #${i.waits}. Nothing starts it until that is finished.`; else { Object.assign(i, { agent: 'worker-' + (nextNo % 7 + 2), kind: 'pi', act: 'reading the brief', age: 'now', human: false, quiet: false, back: false }); note(i, `@yan put ${i.agent} on it`); move(i, 'doing'); said = `${i.agent} is on #${i.n}. A person can always put a session on an issue; the review limit only holds what agents take by themselves.`; } }
  else if (i.st === 'ready' && k === 'h') { i.human = !i.human; note(i, i.human ? '@yan kept it for a person' : '@yan let sessions take it'); }
  else if (k === 'b' && i.st !== 'proposed') { const to = i.st === 'ready' ? 'proposed' : 'ready'; if (hold === i.n) hold = null; note(i, `@yan moved it back to ${to}`); i.ask = null; if (to === 'proposed') { i.by = i.by || '@yan'; i.age = i.age || '2d'; } move(i, to, true); said = `#${i.n} is back in ${to}.`; }
  else if (i.ask && (k === 'y' || k === 'n')) { note(i, `@yan answered: ${k === 'y' ? 'half up' : "banker's"}`); i.ask = null; i.act = 'carrying on'; said = `Answered. ${i.agent} carries on.`; }
  else if (i.st === 'review' && ownerOf(i) === ME && k === 'a') { note(i, '@yan accepted it'); move(i, 'done', true); said = `#${i.n} is done.${inReview(ME) === LIMIT - 1 ? ' Review is under its limit again: agents are handed work.' : ''}`; }
  else if (i.st === 'review' && ownerOf(i) === ME && k === 'x') ask('back', 'send back, because:');
  else if (k === 'enter' && (i.st === 'doing' || i.st === 'review') && i.kind === 'pi') said = `In Pi this opens ${i.agent}'s chat in a box over the board, as on the tree. alt+l closes it.`;
  render();
}
function submit(text) {
  const m = mode, i = get(sel); if (!m) return; mode = null; text = text.trim();
  if (m.kind === 'find') find = text;
  else if (!text) said = 'Nothing was typed, so nothing changed.';
  else if (m.kind === 'new') { const f = i ? i.f : 'saved-cards', made = I(nextNo++, text, f, 'ready', { body: '', means: '' }); made.hist = [['now', '@yan filed it']]; const last = issues.filter(x => x.f === f && x.st === 'ready').pop() || issues.filter(x => x.f === f).pop(); issues.splice(issues.indexOf(last) + 1, 0, made); pick(made.n); said = `#${made.n} is filed under ${f}, and ready: you filed it, so nobody needs to release it.`; }
  else if (m.kind === 'back') { note(i, `@yan sent it back: ${text}`); i.back = true; delete i.result; move(i, 'ready', true); said = `#${i.n} is first in ready under ${i.f}, with what you wrote. ${i.agent} is told.`; }
  else if (m.kind === 'else') { note(i, `@yan said instead: ${text}`); if (i.ask) { i.ask = null; i.act = 'reading what you said'; } said = `${i.agent || i.by} is told what you typed, and that it was said instead of an answer.`; }
  render();
}

// The other terminal: the same server, from a shell.
const LOG = [];
const P = c => LOG.push(`<span class="p">$</span> <span class="c">${esc(c)}</span>`), O = (...l) => LOG.push(...l);
function shell(c) {
  const mine = i => epicOf(i).repo === 'shop', h = hold && get(hold);
  if (c === 'next') {
    P('pi-lattice work next');
    if (h) O(`You are on #${h.n} ${esc(h.t)}. Say done or drop it first.   <span class="td">exit 4</span>`);
    else if (full(ME)) O(`<span class="ta">Nothing to take: ${inReview(ME)} of @yan's are waiting for review, and ${LIMIT} is the limit.</span>   <span class="td">exit 3</span>`);
    else {
      const i = issues.find(x => x.st === 'ready' && mine(x) && !held(x) && !x.human);
      if (!i) O('Nothing is ready for this repository.   <span class="td">exit 3</span>');
      else { Object.assign(i, { agent: 'claude', kind: 'cli', act: 'last command just now', age: 'now', quiet: false, back: false }); note(i, 'claude took it, through the command line'); const s = sel, cc = col; move(i, 'doing'); hold = i.n; if (s !== i.n) { sel = s; col = cc; if (!get(sel)) toCol(col); }
        O(`<span class="c">#${i.n} ${esc(i.t)}</span>   <span class="td">task · ${i.f} · @yan · shop</span>`, esc(i.body), `Done means: ${esc(i.means || 'not written.')}`, '<span class="td">It is yours until you say done or drop it, or go quiet for 30 minutes.</span>'); }
    }
  } else if (c === 'done') {
    if (!h) { P('pi-lattice work done'); O('You hold no issue. Take one with: pi-lattice work next   <span class="td">exit 4</span>'); }
    else { P(`pi-lattice work done ${h.n} --summary "…" --check "tests pass; tried it by hand"`); h.result = { sum: `${h.t[0].toUpperCase() + h.t.slice(1)}: built as the issue says, on branch work/${h.n}.`, check: 'tests pass · tried it by hand', diff: '+64 −9 in 3 files' }; h.age = 'now'; note(h, 'claude put it up for review'); const s = sel, cc = col; move(h, 'review'); if (s !== h.n) { sel = s; col = cc; } hold = null; O(`#${h.n} is up for review by @yan.${full(ME) ? ` <span class="td">That is ${inReview(ME)} of ${LIMIT}: nothing more is handed out until @yan looks.</span>` : ''}`); }
  } else if (c === 'drop') {
    if (!h) { P('pi-lattice work drop'); O('You hold no issue.   <span class="td">exit 4</span>'); }
    else { P(`pi-lattice work drop ${h.n} "needs the staging key, which I do not have"`); note(h, 'claude gave it back: needs the staging key'); const s = sel, cc = col; move(h, 'ready', true); if (s !== h.n) { sel = s; col = cc; } hold = null; O(`#${h.n} is back in ready, first under ${h.f}, with what you wrote.`); }
  } else if (c === 'board') {
    P('pi-lattice work');
    O(STATES.map(s => `${s} ${issues.filter(i => i.st === s).length}`).join('   ') + (full(ME) ? `   <span class="ta">review is full for @yan</span>` : ''));
    issues.filter(i => i.st === 'ready' && mine(i)).slice(0, 4).forEach(i => O(`  ${held(i) ? '⧗' : i.human ? '□' : '○'} #${i.n} ${esc(i.t)}  <span class="td">${i.f}${held(i) ? ' · waits on #' + i.waits : ''}</span>`));
  } else {
    P('pi-lattice work prime');
    O('This team tracks its work as issues on a lattice server. You are one of several agents on it.', '  next            take the next ready issue. Do only that issue.', '  note N "…"      write down what you learn; the next agent reads it.', '  add "…"         file what you find. It waits for a person to release it.', '  done N --summary "…" --check "…"   say what you did and how you checked.', '  drop N "why"    give it back when you cannot finish.', '<span class="td">Add --json to read any of them as data. A person accepts your work; you do not close issues.</span>');
  }
  $('#log').innerHTML = LOG.slice(-60).join('\n'); $('#log').scrollTop = 1e6; said = ''; render();
}
LOG.push('<span class="td"># Run a command below. Take an issue while review is full, then accept one above and try again.</span>');
$('#log').innerHTML = LOG.join('\n');

document.addEventListener('click', e => {
  const t = e.target.closest('[data-n],[data-k],[data-col],[data-lane],[data-c]'); if (!t) return;
  if (t.dataset.c) return shell(t.dataset.c);
  if (mode) mode = null;
  if (t.dataset.n) { pick(+t.dataset.n); said = ''; render(); }
  else if (t.dataset.col) { toCol(+t.dataset.col); said = ''; render(); }
  else if (t.dataset.lane) { folded.has(t.dataset.lane) ? folded.delete(t.dataset.lane) : folded.add(t.dataset.lane); if (!get(sel) || !shown(get(sel))) toCol(col); render(); }
  else key(t.dataset.k);
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (mode) {
    if (e.key === 'Enter') { e.preventDefault(); submit($('#line').value); }
    else if (e.key === 'Escape') { mode = null; said = ''; render(); }
    return;
  }
  if (e.target.closest && e.target.closest('#sh')) return;
  const k = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', Tab: 'tab', ' ': 'space', Escape: 'esc', Enter: 'enter' }[e.key] || (e.key.length === 1 ? e.key : null);
  if (!k || (k === 'tab' && e.shiftKey)) return;
  e.preventDefault(); key(k);
});
narrow.addEventListener('change', render);
const FR = '⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏'; let fr = 0;
if (!still) setInterval(() => { fr = (fr + 1) % FR.length; document.querySelectorAll('.spin').forEach(e => e.textContent = FR[fr]); }, 90);
render();
</script>
</body>
</html>
