<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<title>Lattice Steering</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: two terminals. The upper is Pi on the canopy: the tree of work on a grid of cells, a panel for the selected item, and one line at the foot where a person says what they want and is answered. The lower is another agent's shell on the same work. Both are pictures of a terminal, so the page is dark by choice in either theme; the tokens are the ones the pane and canopy mockups use. */
:root {
  color-scheme: dark;
  --page: #06080c; --t-bg: #0b0e14; --t-panel: #10141c; --t-edge: #232936; --t-fg: #c6ccd9; --t-dim: #808a9e; --t-bright: #f3f6fb;

}
* { box-sizing: border-box; }

.page { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.win { background: var(--t-bg); border: 1px solid var(--t-edge); border-radius: 6px; overflow: hidden; }
.bar { display: flex; flex-wrap: wrap; gap: 2px 16px; justify-content: space-between; padding: 5px 14px; background: var(--t-panel); border-bottom: 1px solid var(--t-edge); color: var(--t-dim); }
.bar b { color: var(--t-fg); font-weight: 400; }

.row { padding: 0 14px; }

<div class="page">
  <section class="win" id="pi" aria-label="Pi, on the canopy">

    <div class="row" id="keys"></div>

    for (let a = 0; a < 6.28; a += .3) if (!run || ((a - turn) % 6.28 + 6.28) % 6.28 > 1.6) plot(X + Math.cos(a) * 3.3, Y + Math.sin(a) * 3.3, col, 1); });

  cells.forEach((c, k) => { const X = (k % COLS) * CW, Y = Math.floor(k / COLS) * CH; ctx.fillStyle = c.col; ctx.globalAlpha = [.5, .95, 1][c.hot];
    c.d.forEach(b => { ctx.beginPath(); ctx.arc(X + 2 + (b & 1) * 4, Y + 2.1 + (b >> 1) * 4.25, 1.15, 0, 6.3); ctx.fill(); }); });
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  text.forEach(e => {

    ctx.globalAlpha = 1;
    if (ch.length > 1 || e.on) { ctx.fillStyle = e.on ? K.sel : K.bg; ctx.fillRect(e.c * CW - (e.on ? 3 : 1), e.r * CH + (e.on ? 0 : 1), ch.length * CW + (e.on ? 6 : 2), CH - (e.on ? 0 : 2)); }

    ch.forEach((g, i) => ctx.fillText(g, (e.c + i) * CW + CW / 2, e.r * CH + CH / 2 + .5));

}
function loop(ms) { draw(ms); requestAnimationFrame(loop); }
const kick = () => { if (still) { last = -1; draw(clock + 1000); } };

// The words at the foot and in the panel.
const stateOf = it => it.level < 3 ? `${nDone(it)} of ${leaves(it).length} landed` : { done: 'landed', run: `${it.agent} is on it${it.out ? ', from a shell' : ''}`, ask: it.ask && it.ask.land ? 'finished, and waiting for you' : `${it.agent} asks`, wait: held(it) ? `waits on ${it.waits}` : 'free to start', plan: 'nobody is on it yet' }[it.state];
const whom = it => { const t = tender(it); return `${t.seat ? t.seat.role : 'coordinator'} on ${t.name}`; };
const Kb = (k, d, amber) => `<button class="k${amber ? ' amber' : ''}" data-k="${k}"><kbd>${k}</kbd> ${d}</button>`;
function tries(it) {
  const out = ['this first'];
  if (it.level < 3 && !(it.dirs || []).length) out.push('ask me before anything here lands');

  if (it.level === 3 && it.state !== 'done') out.push('split it by provider');
  if (it.state === 'wait' || it.state === 'plan') out.push('why is this not started?');
  if (it.level < 3 && leaves(it).some(t => t.state === 'plan')) out.push('put more agents on this');

}
function paint() {
  const mine = t => own(apex(t)) === ME, asks = items.filter(t => t.ask), mineAsk = asks.filter(mine).length, ch = unseen().length;
  const people = Object.keys(HUE).map(p => { if (p === 'teo') return '<span class="td">○@teo away</span>'; const n = items.filter(t => own(apex(t)) === p && (t.state === 'run' || (t.seat && t.seat.state === 'run'))).length, a = asks.filter(t => own(apex(t)) === p).length;
    return `<span><span style="color:${HUE[p]}">@${p}</span> <span style="color:${HUE[p]}">⠹</span>${n}${a ? ` <span class="ta">●${a}</span>` : ''}</span>`; }).join('');
  $('#top').innerHTML = `<span class="net">◆ harbor</span>${people}<span class="end"><span class="${ch ? 'tw' : 'td'}">+ ${ch} changed by agents since you looked</span><span class="${mineAsk ? 'ta' : 'td'}">● ${mineAsk} need you</span></span>`;

  const it = sel, o = own(it), t = tender(it), dirs = dirsFor(it), kids = it.kids, hist = events.filter(e => e.it === it.name || (find(e.it) && path(find(e.it)).includes(it.name))).slice(0, 4);
  const g = k => { const x = glyph(k); return `<span style="color:${x[1]}">${x[0]}</span>`; };
  $('#side').innerHTML = `<div><div class="line"><span class="tw nm">${esc(it.name)}</span><span class="td">${LEVEL[it.level]} · #${it.no}</span></div><div class="td">${path(it).length ? esc(path(it).join(' ▸ ')) : '◆ harbor'}</div>` +
    `<div><span style="color:${HUE[o]}">@${o}${o === ME ? ' (you)' : ''}</span> <span class="td">· ${esc(stateOf(it))}</span></div></div>` +
    `<div><h3>TENDED BY</h3><div>${t.seat ? esc(t.seat.role) : 'coordinator'} <span class="td">${t === it ? 'here' : 'on ' + esc(t.name)}</span></div><div class="td">It keeps the issues under it. What you say here goes to it.</div></div>` +
    `<div><h3>DIRECTIONS</h3>${dirs.length ? dirs.map(d => `<div class="dir"><span style="color:${HUE[d.who]}">⚑</span><span>${esc(d.text)}<br><span class="td">@${d.who}, ${d.on === it ? 'here' : 'on ' + esc(d.on.name)}</span></span></div>`).join('') : '<div class="td">None stand here or above. The agents decide.</div>'}</div>` +
    (kids.length ? `<div><h3>UNDER IT</h3>${kids.map(k => `<div class="line"><span>${k.level === 3 ? g(k) : '<span class="td">›</span>'}</span><span class="nm${k.state === 'plan' || k.state === 'wait' ? ' td' : ''}">${esc(k.name)}</span><span class="td">${k.level === 3 ? esc(k.state === 'run' || k.state === 'ask' ? k.agent : k.state === 'wait' ? '⧗ ' + k.waits : k.state === 'done' ? 'landed' : '') : nDone(k) + '/' + leaves(k).length}</span></div>`).join('')}</div>` : '') +
    (hist.length ? `<div><h3>WHAT HAPPENED</h3>${hist.map(e => `<div><span class="td">${e.age}</span> ${esc(e.who)} ${esc(e.what)}<br><span class="td">${esc(e.why)}</span></div>`).join('')}</div>` : '');

  let h;
  const head = `<div class="what">${g(it.level === 3 ? it : { state: it.seat ? 'run' : 'plan', owner: o })} <span class="tw">${esc(it.name)}</span><span class="td">${LEVEL[it.level]}</span><span style="color:${HUE[o]}">@${o}${o === ME ? ' (you)' : ''}</span><span class="td">${esc(stateOf(it))}</span></div>`;
  if (mode) h = `<label id="linewrap"><span style="color:${HUE[ME]}">to ${esc(whom(it))}, about ${esc(it.name)}:</span><input id="line" autocomplete="off" spellcheck="false" aria-label="What you want"></label>` +
    `<div class="td">${mine(it) ? 'It will change the issues to match, and say what it did.' : `This is @${own(apex(it))}'s. It goes as a message from you, for them to approve.`}  enter to send · esc to leave it</div><div class="try">${(mode.kind === 'back' ? ['retries must stop after 3 days', 'add a test for a replayed event'] : tries(it)).map(s => `<button data-say="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
  else if (pending) h = head + `<div><span style="color:${HUE[ME]}">you:</span> ${esc(pending.text)}</div><div class="td">⠹ ${esc(pending.who)} is reading it…</div>`;
  else {
    h = head;
    if (viewing) h += `<div class="ans">+ ${esc(viewing.who)} ${esc(viewing.what)} <span class="td">${viewing.age} ago</span></div><div><span class="td">why</span>  ${esc(viewing.why)}</div>`;
    else if (answer && answer.who === 'canopy') h += `<div class="td">${esc(answer.said)}</div>`;
    else if (answer) h += `<div><span style="color:${HUE[ME]}">you:</span> ${esc(answer.text)}</div><div class="ans"><span class="td">${esc(answer.who)}:</span> ${esc(answer.said)}</div>`;
    else if (it.ask) h += `<div>${esc(it.ask.q)}</div>`;
    else h += `<div class="td">${(it.dirs || []).length ? 'A direction of ' + it.dirs.map(d => '@' + d.who).join(', ') + ' stands here.' : 'Agents keep this. Say what you want and ' + esc(whom(it)) + ' changes it.'}</div>`;
    const ks = [];
    if (viewing) { if (viewing.undo && !viewing.undone) ks.push(Kb('x', 'put it back', 1)); ks.push(Kb('u', `next change${unseen().length ? ' (' + unseen().length + ')' : ''}`)); }
    else if (!answer && it.ask && mine(it)) { it.ask.keys.forEach(([k, d]) => ks.push(Kb(k, d, 1))); ks.push(Kb('o', 'something else', 1)); }
    ks.push(Kb('space', 'say something'));

  $('#keys').innerHTML = [['←→', 'beside'], ['↑↓', 'level'], ['space', 'say'], ['u', `what agents changed${ch ? ' (' + ch + ')' : ''}`], ['tab', 'next that needs you'], ['enter', 'open']].map(([k, d]) => Kb(k, d)).join('');

  kick();
}

// Whatever tends the branch reads the line and changes the issues. The reading here is a few patterns; in Pi it is a session.
function carry(it, text) {
  const who = whom(it), why = `@yan said: “${text}”`, s = text.toLowerCase(), list = it.parent ? it.parent.kids : TREE, under = it.parent ? it.parent.name : 'harbor';
  if (own(apex(it)) !== ME) return `Passed to @${own(apex(it))}'s ${who} as a message from you. It is theirs to approve; nothing has changed.`;
  if (/forget|lift|never mind/.test(s)) { const n = (it.dirs || []).length; it.dirs = []; return n ? `Lifted: ${n === 1 ? 'the direction' : n + ' directions'} on ${it.name} no longer ${n === 1 ? 'stands' : 'stand'}. Everything under it is told.` : `Nothing of yours stands on ${it.name}.`; }

  if (/first|priorit|before the rest|now\b/.test(s)) { if (list[0] === it) return `${it.name} is already first under ${under}.`; const at = list.indexOf(it); list.splice(at, 1); list.unshift(it); layout(); log(tender(it).seat.role, `moved ${it.name} first under ${under}`, why, it.name); return `${it.name} is first under ${under} now. Sessions take what is under it before the rest.`; }
  if (/last|later|after the rest/.test(s)) { list.splice(list.indexOf(it), 1); list.push(it); layout(); log(tender(it).seat.role, `moved ${it.name} last under ${under}`, why, it.name); return `${it.name} is last under ${under} now.`; }
  if (/drop|cut this|remove|not doing|delete/.test(s)) { const ls = leaves(it), run = ls.filter(t => t.state === 'run' || t.state === 'ask').length, name = it.name; remove(it); log(who.split(' ')[0], `dropped ${name}`, why, sel.name); return `Dropped ${name}${it.level < 3 ? ` and the ${ls.length} under it` : ''}.${run ? ` ${run} session${run > 1 ? 's were' : ' was'} stopped; their branches are kept.` : ''}`; }
  if (/split|break/.test(s)) {
    if (it.level !== 3) return `${it.name} is ${LEVEL[it.level] === 'epic' ? 'an' : 'a'} ${LEVEL[it.level]}: say what it should be split into, or go up into it and split a task.`;
    const by = (s.match(/by (.+)$/) || [])[1] || '', parts = /provider/.test(by) ? ['stripe', 'adyen'] : by.split(/,| and /).map(x => x.trim().replace(/\s+/g, '-')).filter(Boolean).slice(0, 3);
    const names = (parts.length > 1 ? parts : ['a', 'b']).map(p => `${it.name}-${p}`), at = list.indexOf(it), made = names.map(n => T(n, 'plan', { body: `The ${n.split('-').pop()} part of ${it.name}.`, means: 'as for the issue it was split from.' }));
    list.splice(at, 1, ...made); sel = made[0]; layout(); log(tender(made[0]).seat.role, `split ${it.name} into ${names.join(' and ')}`, why, made[0].name); return `Split ${it.name} into ${names.join(' and ')}.${it.state === 'run' || it.state === 'ask' ? ` ${it.agent} carries on with the first.` : ''}`;
  }

}
function send(text) {
  const it = sel, kind = mode.kind; mode = null; text = text.trim(); viewing = null;
  if (!text) { answer = null; return paint(); }
  const t = tender(it); pending = { text, who: whom(it) }; answer = null; paint();
  setTimeout(() => {
    pending = null; let said;
    if (kind === 'back') { it.state = 'run'; delete it.ask; log('reviewer', `sent ${it.name} back`, `@yan said: “${text}”`, it.name); said = `${it.name} is back with ${it.agent}, with what you said.`; }
    else if (kind === 'else') { it.state = 'run'; delete it.ask; said = `${it.agent} is told what you typed, and that it was said instead of an answer.`; }
    else said = carry(it, text);
    answer = { text, who: t.seat ? t.seat.role : 'coordinator', said }; paint();
  }, still ? 0 : 900);
}

function go(it) { if (it) { sel = it; answer = null; viewing = null; } }
function key(k) {
  if (pending) return;
  const it = sel, row = items.filter(i => i.level === it.level).sort((a, b) => (a.level === 3 ? a.parent.tx + a.tx / 1000 : a.tx) - (b.level === 3 ? b.parent.tx + b.tx / 1000 : b.tx)), i = row.indexOf(it), mine = own(apex(it)) === ME;

  else if (k === 'tab') { const a = items.filter(t => t.ask && own(apex(t)) === ME); if (a.length) go(a[(a.indexOf(it) + 1) % a.length]); else answer = { text: 'tab', who: 'canopy', said: 'Nothing needs you.' }; }
  else if (k === 'space') mode = { kind: 'say' };
  else if (k === 'u') { const e = unseen()[0]; if (e) { go(find(e.it)); e.seen = true; find(e.it).fresh = 0; viewing = e; } else { viewing = null; answer = { text: 'u', who: 'canopy', said: 'Nothing else has changed since you looked.' }; } }
  else if (k === 'x' && viewing && viewing.undo && !viewing.undone) { const e = viewing; e.undo(); e.undone = 1; layout(); viewing = null; answer = { text: 'put it back', who: e.who, said: `Put back: I ${e.what.replace(/^moved/, 'had moved').replace(/^added/, 'had added')}. Tell me if the reason still matters.` }; }
  else if (it.ask && mine && !viewing && !answer) {

    if (k === 'o') mode = { kind: 'else' };
    else if (hit && it.ask.land && k === 'x') mode = { kind: 'back' };
    else if (hit && it.ask.land) { it.state = 'done'; delete it.ask; log('reviewer', `landed ${it.name}`, '@yan said to land it.', it.name); answer = { text: hit[1], who: 'reviewer', said: `${it.name} has landed.` }; }

  }
  else if (k === 'enter' && (it.seat || (it.agent && !it.out))) answer = { text: 'enter', who: 'canopy', said: `In Pi this opens ${it.seat ? it.seat.role : it.agent}'s chat in a box over the tree. alt+l closes it.` };

}

// The other terminal: the same server, from a shell.
const LOG = ['<span class="td"># Run a command. Then say "this first" on cart above, and take the next one again.</span>'];
const P = c => LOG.push(`<span class="p">$</span> <span class="c">${esc(c)}</span>`), O = (...l) => LOG.push(...l);
function shell(c) {
  const h = hold && items.includes(hold) && hold.state === 'run' ? hold : null;
  if (c === 'next') {
    P('pi-lattice work next');
    if (h) O(`You are on #${h.no} ${esc(h.name)}. Say done or drop it first.   <span class="td">exit 4</span>`);
    else { const t = order().find(t => t.level === 3 && t.state === 'plan' && own(apex(t)) === ME);
      if (!t) O('Nothing is ready in this repository.   <span class="td">exit 3</span>');
      else { t.state = 'run'; t.agent = 'claude'; t.out = 1; t.fresh = 0; hold = t; log('claude', `took ${t.name}`, 'next in tree order, from a shell.', t.name, { seen: false }); t.fresh = 1; const d = dirsFor(t);
        O(`<span class="c">#${t.no} ${esc(t.name)}</span>   <span class="td">task · ${esc(path(t).slice(1).join(' ▸ '))} · @${own(t)} · shop</span>`, esc(t.body || 'As its tending session wrote it.'), `Done means: ${esc(t.means || 'as written in the issue.')}`, ...(d.length ? ['Directions above it:', ...d.map(x => `  <span style="color:${HUE[x.who]}">⚑</span> ${esc(x.text)}   <span class="td">@${x.who}, on ${esc(x.on.name)}</span>`)] : ['<span class="td">No directions stand above it.</span>']), '<span class="td">It is yours until you say done or drop it, or go quiet for 30 minutes.</span>'); } }
  } else if (c === 'done') {
    if (!h) { P('pi-lattice work done'); O('You hold no issue. Take one with: pi-lattice work next   <span class="td">exit 4</span>'); }
    else { P(`pi-lattice work done ${h.no} --summary "…" --check "tests pass; tried it by hand"`); hold = null; const gate = dirsFor(h).find(d => /ask me|show me|before .*land/.test(d.text)), t = tender(h);
      if (gate) { h.state = 'ask'; h.ask = { land: 1, q: `${h.name} is finished by claude, from a shell, and a direction on ${gate.on.name} sends it to you. Tests pass; tried by hand. +64 −9 in 3 files.`, keys: [['a', 'land it'], ['x', 'send it back']] }; O(`#${h.no} is with @${gate.who}: a direction on ${esc(gate.on.name)} asks for it.`); }
      else { O(`#${h.no} is being checked by ${esc(whom(h))}.`); setTimeout(() => { if (!items.includes(h)) return; h.state = 'done'; h.fresh = 1; log(t.seat ? t.seat.role : 'coordinator', `landed ${h.name}`, 'it does what the issue says done means; no direction above asks for a person.', h.name, { seen: false }); paint(); }, 1400); } }
  } else { P('pi-lattice work prime'); O('This team keeps its work as issues on a lattice server. Agents keep them; you are one.', '  next            take the next ready issue. Read the directions above it: a person gave them.', '  note N "…"      write down what you learn; the next agent reads it.', '  add "…" --why   file what you find, and say why.', '  done N --summary "…" --check "…"   say what you did and how you checked.', '  drop N "why"    give it back when you cannot finish.', '<span class="td">Add --json to read any of them as data.</span>'); }
  $('#log').innerHTML = LOG.slice(-60).join('\n'); $('#log').scrollTop = 1e6; paint();
}
$('#log').innerHTML = LOG.join('\n');

cv.onclick = e => { const b = cv.getBoundingClientRect(), c = (e.clientX - b.left) / b.width * COLS, r = (e.clientY - b.top) / b.height * ROWS, story = sel.level === 3 ? sel.parent : sel.level === 2 ? sel : null;
  let hit = story && story.kids.find((t, j) => { const c0 = Math.max(0, Math.min(COLS - 30, Math.round(story.x) - 5)), row = LEAF - 1 - story.kids.length + j; return r >= row && r < row + 1 && c >= c0 - 1 && c <= c0 + 24; });
  hit = hit || items.find(t => t.level === 3 && Math.abs(c - .5 - (t.parent.x + t.tx - t.parent.tx)) < 1 && r >= LEAF - .2 && r < LEAF + 1.2) || items.find(it => it.level < 3 && c >= it.x - 1 && c <= it.x + 5 + it.name.length && r >= ROWY[it.level] - .5 && r <= ROWY[it.level] + 2);
  if (hit && !pending) { mode = null; go(hit); paint(); } };
document.addEventListener('click', e => { const t = e.target.closest('[data-k],[data-say],[data-c]'); if (!t) return; if (t.dataset.c) return shell(t.dataset.c); if (t.dataset.say) return send(t.dataset.say); if (mode) mode = null; key({ '←→': 'right', '↑↓': 'up' }[t.dataset.k] || t.dataset.k); });
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (mode) { if (e.key === 'Enter') { e.preventDefault(); send($('#line').value); } else if (e.key === 'Escape') { mode = null; paint(); } return; }
  if (e.target.closest && e.target.closest('#sh')) return;
  const k = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', Tab: 'tab', ' ': 'space', Enter: 'enter' }[e.key] || (e.key.length === 1 ? e.key : null);
  if (!k || (k === 'tab' && e.shiftKey)) return;
  e.preventDefault(); key(k);
});
paint();
(document.fonts ? document.fonts.load('13.3px "JetBrains Mono"') : Promise.resolve()).then(() => requestAnimationFrame(loop), () => requestAnimationFrame(loop));
</script>
