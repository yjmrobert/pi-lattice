name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the packages say they support, and the current one.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Integration tests spawn real Pi processes against a scripted model: no network, no tokens.
      # The terminal-interface tests run Pi in a pseudo-terminal from `script`, which the runner has.
      - run: npm test
