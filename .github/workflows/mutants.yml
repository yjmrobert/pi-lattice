name: Mutants

# The tests passing says the code does what they ask. This asks the other thing: would a test
# notice if the code were wrong? Each package's code is changed a little at a time (a mutant),
# and the packages' own tests are run on it (ADR 0047). A mutant that every test passes with is
# something no test holds. It runs beside CI and does not hold a release back.
on:
  push:
    branches: [main]
  pull_request:
  # Once a week everything is tried again from nothing: what is carried from push to push does
  # not see a change outside the code and its tests, such as a newer dependency.
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      whole:
        description: Try every mutant again, carrying nothing from the last run
        type: boolean
        default: false

# A run takes long the first time, and what it found is only kept at its end. So a run on main
# is never cancelled: pushes that come while one runs wait, and only the newest of them runs.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pieces:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pieces: ${{ steps.list.outputs.pieces }}
    env:
      # Packages that are too much for one job, and are a job for each file: the canopy's tests
      # draw whole screens, and a whole run of it on one runner is most of a day.
      BY_FILE: canopy
    steps:
      - uses: actions/checkout@v4
      # A piece is a package, or one file of a package named above.
      - name: List the pieces
        id: list
        run: |
          for package in $(ls packages); do
            if [[ " $BY_FILE " == *" $package "* ]]; then
              for file in $(cd "packages/$package/src" && find . -name '*.ts' | sed 's|^\./||' | sort); do
                name=${file%.ts}
                echo "$package-${name//\//-} packages/$package/src/$file"
              done
            else
              echo "$package packages/$package/src/**/*.ts"
            fi
          done | jq --raw-input --null-input --compact-output '[inputs | split(" ") | { name: .[0], mutate: .[1] }]' > pieces.json
          cat pieces.json
          echo "pieces=$(cat pieces.json)" >> "$GITHUB_OUTPUT"

  mutants:
    name: mutants (${{ matrix.piece.name }})
    needs: pieces
    runs-on: ubuntu-latest
    # The largest piece takes under an hour from nothing. A push after it tries only what changed.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # All of them together are a day or more of one core.
        piece: ${{ fromJSON(needs.pieces.outputs.pieces) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # What the last run found for this piece. The newest is taken: this branch's, else main's.
      - name: Take what the last run found
        if: github.event_name != 'schedule' && !inputs.whole
        uses: actions/cache/restore@v4
        with:
          path: reports/mutation/incremental.json
          key: mutants-${{ matrix.piece.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutants-${{ matrix.piece.name }}-
      # Every package's tests are run on this piece's mutants: a mutant in the contracts may be noticed by a test of the host.
      - name: Put it to mutants
        run: |
          set -o pipefail
          if npm run mutants -- --mutate "$MUTATE" 2>&1 | tee "$RUNNER_TEMP/stryker.log"; then exit 0; fi
          # Stryker stops where no test of a package reaches the code at all: code that only the tests
          # that start Pi run. That is something to say, and nothing that failed. The summary names a
          # package there is no report for.
          if grep -q "No tests were executed" "$RUNNER_TEMP/stryker.log"; then
            echo "::notice title=Not reached::No test of a package reaches $MUTATE, so nothing in it was put to mutants."
            exit 0
          fi
          exit 1
        env:
          MUTATE: ${{ matrix.piece.mutate }}
      - name: Keep what this run found
        if: always() && hashFiles('reports/mutation/incremental.json') != ''
        uses: actions/cache/save@v4
        with:
          path: reports/mutation/incremental.json
          key: mutants-${{ matrix.piece.name }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Every mutant, in the code it was made in, with the tests that reach it: open index.html.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ matrix.piece.name }}
          path: |
            reports/mutation/index.html
            reports/mutation/mutation.json
          if-no-files-found: ignore

  report:
    needs: mutants
    # Also when a package's job failed: what the others found is still said.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-*
          path: reports
      # The table by package, on the page of the run.
      - run: node scripts/mutants.ts reports
